name: CI

# Только PR: guard сверяет изменения с базой PR, а пост-merge прогон на master дублировал бы
# lint/typecheck, тесты и сборку. Ручной запуск — проверка ветки без guard (сборка и статические стадии).
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: AI Quality Gate (static)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Голова PR, а не merge-коммит: подтверждение (HARNESS_ACK_SHA) привязано к SHA коммита,
          # а merge-коммит нестабилен и его SHA не совпадёт со значением переменной.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Полная история: guard строит merge-base с базовым коммитом PR.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static quality gate
        env:
          QUALITY_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          # Подтверждение изменений Harness/CI: repository variable (меняет только владелец репозитория),
          # действует лишь для своего коммита.
          QUALITY_GATE_HARNESS_ACK_SHA: ${{ vars.HARNESS_ACK_SHA }}
        run: npm run quality-gate

  # Стадия 2: полный набор тестов (включая регрессию самого gate). Падение блокирует Build.
  tests:
    name: Tests
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test

  # Стадия 3: сборка. Запускается только после зелёных gate и тестов.
  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
